name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, alienware]
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,tools]"
      - name: Unit tests
        run: pytest -q --cov=alk --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14
      - name: Smoke test
        run: |
          alk --version
          alk doctor || true
          # The example is intentionally broken: alk lint must find issues (exit 1).
          if alk lint examples/bad-playbook.yml; then echo "expected findings" && exit 1; fi

  e2e:
    name: E2E migration (ansible-core ${{ matrix.ansible-core }})
    runs-on: [self-hosted, alienware]
    strategy:
      fail-fast: false
      matrix:
        ansible-core: ["2.16", "2.18"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . "ansible-core==${{ matrix.ansible-core }}.*" ansible-lint yamllint
      - name: Ansible 2.9 repo -> alk check --fix -> valid modern repo
        run: bash tests/e2e.sh

  lint-self:
    name: Lint this repo's own YAML
    runs-on: [self-hosted, alienware]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - name: yamllint workflows
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 160}, truthy: disable}}' .github/

  security:
    name: Security audit (pip-audit)
    runs-on: [self-hosted, alienware]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,tools]" pip-audit
      - name: Audit dependencies for known vulnerabilities
        # --skip-editable: the project itself is installed editable from local
        # source (not on PyPI); audit third-party dependencies only.
        # No --strict: pip-audit 2.x treats an intentionally skipped editable
        # as a collection failure under --strict.
        run: pip-audit --skip-editable
