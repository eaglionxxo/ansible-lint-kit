name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,tools]"
      - name: Unit tests
        run: pytest -q
      - name: Smoke test (doctor + lint the bad example)
        run: |
          alk --version
          alk doctor || true
          # The example is intentionally broken: alk lint must find issues (exit 1).
          if alk lint examples/bad-playbook.yml; then echo "expected findings" && exit 1; fi
