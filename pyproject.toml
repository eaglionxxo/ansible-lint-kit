[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ansible-lint-kit"
version = "0.1.0"
description = "Diagnose, lint and safely fix Ansible playbooks from Windows via WSL + VS Code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eaglionxxo" }]
dependencies = []

[project.optional-dependencies]
tools = ["ansible-core>=2.15", "ansible-lint>=24.2", "yamllint>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
alk = "alk.cli:main"

[tool.setuptools.packages.find]
include = ["alk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
